[workspace]
resolver = "2"
members = ["crates/trazo_core", "crates/trazo_app"]

[workspace.package]
version = "0.4.1"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/hazielcampos/trazo"
homepage = "https://github.com/hazielcampos/trazo"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.18"
zip = { version = "9", default-features = false, features = ["deflate"] }
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "persistence"] }
egui = "0.37"
log = "0.4"

[profile.dev]
opt-level = 1

[profile.dev.package.trazo_core]
opt-level = 3

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
