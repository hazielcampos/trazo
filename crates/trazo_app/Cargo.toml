[package]
name = "trazo_app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Trazo: aplicación de animación cuadro a cuadro y dibujo"

[lib]
# `cdylib` is what Android loads; `lib` lets the desktop binary reuse the code.
crate-type = ["lib", "cdylib"]

[[bin]]
name = "trazo"
path = "src/main.rs"

[dependencies]
gif = "0.14"
trazo_core = { path = "../trazo_core" }
eframe.workspace = true
egui.workspace = true
log.workspace = true
serde.workspace = true
cpal = "0.18"
rtrb = "0.4"
lz4_flex = "0.11"

[target.'cfg(not(target_os = "android"))'.dependencies]
rfd = "0.17"

# MP4 export through Media Foundation (already in the build through cpal).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_Foundation"] }

[target.'cfg(target_os = "android")'.dependencies]
eframe = { workspace = true, features = ["android-native-activity"] }
winit = { version = "0.30", features = ["android-native-activity"] }
android_logger = "0.15"
jni = "0.21"
ndk = { version = "0.9", features = ["media", "api-level-28"] }
ndk-sys = { version = "0.6", features = ["media"] }
ndk-context = "0.1"

# Android packaging (used by `cargo apk build -p trazo_app`).
[package.metadata.android]
package = "lat.inerzadynamics.trazo"
apk_name = "Trazo"
resources = "../../assets/icon/android-res"
build_targets = ["aarch64-linux-android", "armv7-linux-androideabi", "x86_64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 29
target_sdk_version = 37

[package.metadata.android.application]
label = "Trazo"
icon = "@mipmap/ic_launcher"

[package.metadata.android.application.activity]
orientation = "unspecified"
config_changes = "orientation|screenSize|keyboardHidden|screenLayout|uiMode"

[[package.metadata.android.uses_permission]]
name = "android.permission.RECORD_AUDIO"

[[package.metadata.android.uses_permission]]
name = "android.permission.READ_MEDIA_AUDIO"

[[package.metadata.android.uses_permission]]
name = "android.permission.READ_MEDIA_IMAGES"

[[package.metadata.android.uses_permission]]
name = "android.permission.READ_MEDIA_VIDEO"

[[package.metadata.android.uses_permission]]
name = "android.permission.READ_EXTERNAL_STORAGE"
max_sdk_version = 32
