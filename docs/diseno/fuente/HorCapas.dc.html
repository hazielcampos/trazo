<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Capas en horizontal</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0E0E0F}
a{color:#D9F45A}a:hover{color:#E8FF8A}
button{font-family:inherit;cursor:pointer}
.ib{width:44px;height:44px;border:0;border-radius:12px;background:transparent;color:#F2F2F0;display:flex;align-items:center;justify-content:center;padding:0;flex:none;position:relative}
.ib svg,.add svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
.tab{font-variant-numeric:tabular-nums}
.rail{position:absolute;width:56px;border-radius:20px;background:#1B1B1D;box-shadow:0 10px 30px rgba(0,0,0,0.5),inset 0 0 0 1px rgba(255,255,255,0.05);display:flex;flex-direction:column;align-items:center;padding:6px 0;box-sizing:border-box}
.add{flex:1;height:52px;border:0;border-radius:12px;background:#232326;color:#F2F2F0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:500}
.row{display:flex;align-items:center;gap:8px;height:56px;padding:0 0 0 8px;border-radius:12px}
.t{flex:1;display:flex;flex-direction:column;gap:1px;min-width:0}
.t b{font-size:14px;font-weight:600}
.t span{font-size:11px;color:#A1A1A6}
.grip{width:28px;height:44px;display:flex;align-items:center;justify-content:center;color:#75757B;flex:none}
</style>
</helmet>
<div style="width:844px;height:390px;position:relative;overflow:hidden;background:#0E0E0F;font-family:'Hanken Grotesk',system-ui,sans-serif;color:#F2F2F0">
  <!-- Tools stay on the left -->
  <div class="rail" style="left:44px;top:14px;height:296px">
    <button class="ib" aria-label="Volver"><svg viewBox="0 0 24 24"><path d="M14.5 18l-6-6 6-6"/></svg></button>
    <div style="width:26px;height:1px;background:#2F2F33;margin:3px 0"></div>
    <button class="ib" aria-label="Pincel" style="background:#D9F45A;color:#121212;border-radius:14px"><svg viewBox="0 0 24 24"><path d="M4.5 19.5l1.2-4.3 9.6-9.6a2.2 2.2 0 0 1 3.1 3.1l-9.6 9.6z"/><path d="M13.6 7.3l3.1 3.1"/></svg></button>
    <button class="ib" aria-label="Goma"><svg viewBox="0 0 24 24"><path d="M9 19.5h10"/><path d="M5.6 15.1l8-8a2 2 0 0 1 2.8 0l2.5 2.5a2 2 0 0 1 0 2.8l-7.1 7.1H9.9z"/><path d="M9.6 11.1l4.3 4.3"/></svg></button>
    <button class="ib" aria-label="Relleno"><svg viewBox="0 0 24 24"><path d="M6 10.5l5-5.5 7.5 7.5-5.4 5.4a2 2 0 0 1-2.8 0L6 13.6a2.2 2.2 0 0 1 0-3.1z"/><path d="M6.2 12.4h12"/><path d="M20.5 17c0 1.1-.7 1.9-1.5 1.9s-1.5-.8-1.5-1.9c0-1 1.5-2.6 1.5-2.6s1.5 1.6 1.5 2.6z"/></svg></button>
    <button class="ib" aria-label="Selección"><svg viewBox="0 0 24 24"><path d="M12 4.5c4.3 0 7.7 2 7.7 4.6S16.3 13.7 12 13.7 4.3 11.7 4.3 9.1 7.7 4.5 12 4.5z"/><path d="M8.2 13.1c-1.4.5-2.1 1.6-1.6 2.6.5 1 2 1.2 2.8.3"/><path d="M9.4 16c.1 1.6-.8 3-2.4 3.7"/></svg></button>
    <button class="ib" aria-label="Más herramientas"><svg viewBox="0 0 24 24"><circle cx="5.5" cy="12" r="1.5" style="fill:currentColor;stroke:none"/><circle cx="12" cy="12" r="1.5" style="fill:currentColor;stroke:none"/><circle cx="18.5" cy="12" r="1.5" style="fill:currentColor;stroke:none"/></svg></button>
  </div>
  <img src="/_blob/bb5e6c92b21c09b25a134fbfbda5db4c" alt="Dibujo 8" style="position:absolute;left:150px;top:14px;width:232px;height:290px;border-radius:3px;box-shadow:0 12px 40px rgba(0,0,0,0.6)">
  <div style="position:absolute;left:112px;width:332px;bottom:24px;height:58px;border-radius:20px;background:#1B1B1D;box-shadow:inset 0 0 0 1px rgba(255,255,255,0.05);display:flex;align-items:center;gap:8px;padding:0 7px;box-sizing:border-box">
    <button class="ib" aria-label="Reproducir" style="border-radius:22px;background:#F2F2F0;color:#121212"><svg viewBox="0 0 24 24" style="fill:#121212;stroke:none"><path d="M8.5 5.8v12.4a.8.8 0 0 0 1.2.7l10-6.2a.8.8 0 0 0 0-1.4l-10-6.2a.8.8 0 0 0-1.2.7z"/></svg></button>
    <span class="mono" style="font-size:15px;font-weight:600">08<span class="tab" style="color:#A1A1A6;font-size:12px;font-family:'Hanken Grotesk'"> / 24</span></span>
    <div style="flex:1"></div>
    <button aria-label="Nuevo dibujo" style="height:44px;border:1.5px dashed #75757B;border-radius:12px;background:#252528;color:#F2F2F0;font-size:13px;font-weight:600;display:flex;align-items:center;gap:4px;padding:0 10px 0 6px"><svg viewBox="0 0 24 24" style="width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round"><path d="M12 5v14M5 12h14"/></svg>Nuevo</button>
  </div>

  <!-- Layers panel, docked on the right (opened from the right rail) -->
  <div role="dialog" aria-label="Capas" style="position:absolute;left:460px;right:44px;top:14px;bottom:14px;border-radius:20px;background:#161618;box-shadow:0 10px 40px rgba(0,0,0,0.6),inset 0 0 0 1px rgba(255,255,255,0.05);padding:6px 8px 8px;box-sizing:border-box;display:flex;flex-direction:column;gap:6px">
    <div style="display:flex;align-items:center;padding-left:8px">
      <h2 style="margin:0;font-size:17px;font-weight:600;flex:1">Capas</h2>
      <button class="ib" aria-label="Cerrar capas"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div style="display:flex;gap:6px">
      <button class="add"><svg viewBox="0 0 24 24"><path d="M4.5 19.5l1.2-4.3 9.6-9.6a2.2 2.2 0 0 1 3.1 3.1l-9.6 9.6z"/></svg>Dibujo</button>
      <button class="add"><svg viewBox="0 0 24 24"><path d="M3.5 7.5a2 2 0 0 1 2-2h4l2 2.5h7a2 2 0 0 1 2 2v7.5a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/></svg>Carpeta</button>
      <button class="add"><svg viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><circle cx="9" cy="10" r="1.8"/><path d="M20 16l-5-5-8.5 8.5"/></svg>Imagen</button>
      <button class="add"><svg viewBox="0 0 24 24"><rect x="3.5" y="5.5" width="12.5" height="13" rx="2.5"/><path d="M16 10.5l4.5-2.8v8.6L16 13.5"/></svg>Video</button>
    </div>
    <div style="display:flex;flex-direction:column;gap:1px">
      <div class="row" style="background:#232326">
        <img src="/_blob/10f76d377b57444960ee88e487676c0a" alt="" style="width:34px;height:42px;border-radius:6px;box-shadow:0 0 0 2px #D9F45A">
        <div class="t"><b>Tinta</b><span>Normal · 100 %</span></div>
        <button class="ib" aria-label="Ocultar Tinta"><svg viewBox="0 0 24 24"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
        <button class="ib" aria-label="Opciones" style="color:#A1A1A6"><svg viewBox="0 0 24 24"><circle cx="12" cy="5.5" r="1.5" style="fill:currentColor;stroke:none"/><circle cx="12" cy="12" r="1.5" style="fill:currentColor;stroke:none"/><circle cx="12" cy="18.5" r="1.5" style="fill:currentColor;stroke:none"/></svg></button>
        <span class="grip" aria-label="Arrastra para mover"><svg viewBox="0 0 24 24" style="width:16px;height:16px;fill:currentColor"><circle cx="9" cy="7" r="1.5"/><circle cx="15" cy="7" r="1.5"/><circle cx="9" cy="12" r="1.5"/><circle cx="15" cy="12" r="1.5"/><circle cx="9" cy="17" r="1.5"/><circle cx="15" cy="17" r="1.5"/></svg></span>
      </div>
      <div class="row">
        <img src="/_blob/fe4c4c4cbae132edfb8a8a7bdeabfb70" alt="" style="width:34px;height:42px;border-radius:6px">
        <div class="t"><b>Acuarela</b><span>Multiplicar · 85 %</span></div>
        <button class="ib" aria-label="Ocultar Acuarela"><svg viewBox="0 0 24 24"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
        <button class="ib" aria-label="Opciones" style="color:#A1A1A6"><svg viewBox="0 0 24 24"><circle cx="12" cy="5.5" r="1.5" style="fill:currentColor;stroke:none"/><circle cx="12" cy="12" r="1.5" style="fill:currentColor;stroke:none"/><circle cx="12" cy="18.5" r="1.5" style="fill:currentColor;stroke:none"/></svg></button>
        <span class="grip"><svg viewBox="0 0 24 24" style="width:16px;height:16px;fill:currentColor"><circle cx="9" cy="7" r="1.5"/><circle cx="15" cy="7" r="1.5"/><circle cx="9" cy="12" r="1.5"/><circle cx="15" cy="12" r="1.5"/><circle cx="9" cy="17" r="1.5"/><circle cx="15" cy="17" r="1.5"/></svg></span>
      </div>
      <div class="row">
        <div style="width:34px;height:42px;border-radius:6px;background:#2A2A2D"></div>
        <div class="t"><b>Boceto</b><span>Oculta · no sale en el video</span></div>
        <button class="ib" aria-label="Mostrar Boceto" style="color:#A1A1A6"><svg viewBox="0 0 24 24"><path d="M4 4l16 16"/><path d="M9.9 5.8A9.6 9.6 0 0 1 12 5.5c6 0 9.5 6.5 9.5 6.5a16 16 0 0 1-2.6 3.4M6.3 7.6A15.6 15.6 0 0 0 2.5 12S6 18.5 12 18.5a9 9 0 0 0 4.1-1"/></svg></button>
        <button class="ib" aria-label="Opciones" style="color:#A1A1A6"><svg viewBox="0 0 24 24"><circle cx="12" cy="5.5" r="1.5" style="fill:currentColor;stroke:none"/><circle cx="12" cy="12" r="1.5" style="fill:currentColor;stroke:none"/><circle cx="12" cy="18.5" r="1.5" style="fill:currentColor;stroke:none"/></svg></button>
        <span class="grip"><svg viewBox="0 0 24 24" style="width:16px;height:16px;fill:currentColor"><circle cx="9" cy="7" r="1.5"/><circle cx="15" cy="7" r="1.5"/><circle cx="9" cy="12" r="1.5"/><circle cx="15" cy="12" r="1.5"/><circle cx="9" cy="17" r="1.5"/><circle cx="15" cy="17" r="1.5"/></svg></span>
      </div>
      <div class="row">
        <div style="width:34px;height:42px;border-radius:6px;background:#E9E3D2"></div>
        <div class="t"><b>Papel</b><span>Fondo · siempre detrás</span></div>
        <button class="ib" aria-label="Ocultar Papel"><svg viewBox="0 0 24 24"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
        <button class="ib" aria-label="Opciones" style="color:#A1A1A6"><svg viewBox="0 0 24 24"><circle cx="12" cy="5.5" r="1.5" style="fill:currentColor;stroke:none"/><circle cx="12" cy="12" r="1.5" style="fill:currentColor;stroke:none"/><circle cx="12" cy="18.5" r="1.5" style="fill:currentColor;stroke:none"/></svg></button>
        <span class="grip" style="opacity:0.4"><svg viewBox="0 0 24 24" style="width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></span>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":844,"height":390}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
