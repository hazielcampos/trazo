<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Editor en teléfono</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0E0E0F}
a{color:#D9F45A}a:hover{color:#E8FF8A}
button{font-family:inherit;cursor:pointer}
.ib{width:44px;height:44px;border:0;border-radius:12px;background:transparent;color:#F2F2F0;display:flex;align-items:center;justify-content:center;padding:0;flex:none}
.ib svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
.tab{font-variant-numeric:tabular-nums}
</style>
</helmet>
<div style="width:390px;height:844px;position:relative;overflow:hidden;background:#0E0E0F;font-family:'Hanken Grotesk',system-ui,sans-serif;color:#F2F2F0">

  <!-- Top bar: only navigation and the way out -->
  <div style="position:absolute;left:12px;right:12px;top:50px;height:44px;display:flex;align-items:center;gap:4px">
    <button class="ib" aria-label="Volver a Mis animaciones"><svg viewBox="0 0 24 24"><path d="M14.5 18l-6-6 6-6"/></svg></button>
    <button aria-label="Opciones de la animación" style="border:0;background:transparent;color:#F2F2F0;display:flex;flex-direction:column;align-items:flex-start;padding:0 6px;min-height:44px;justify-content:center">
      <span style="display:flex;align-items:center;gap:4px;font-size:17px;font-weight:600;letter-spacing:-0.2px">Viento<svg viewBox="0 0 24 24" style="width:16px;height:16px;fill:none;stroke:#A1A1A6;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><path d="M7 10l5 5 5-5"/></svg></span>
      <span style="font-size:12px;color:#A1A1A6;display:flex;align-items:center;gap:5px"><span style="width:6px;height:6px;border-radius:3px;background:#5BD6C0;display:inline-block"></span>Guardado · 12 fps</span>
    </button>
    <div style="flex:1"></div>
    <button class="ib" aria-label="Exportar" style="background:#252528"><svg viewBox="0 0 24 24"><path d="M12 15V4.5"/><path d="M8 8.5l4-4 4 4"/><path d="M5 13.5V18a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4.5"/></svg></button>
  </div>

  <!-- Canvas: 24 pt clear of both edges (system back gesture) -->
  <img src="/_blob/bb5e6c92b21c09b25a134fbfbda5db4c" alt="Dibujo 8 de Viento" style="position:absolute;left:72px;top:110px;width:294px;height:368px;border-radius:3px;box-shadow:0 0 0 1px rgba(255,255,255,0.04),0 12px 40px rgba(0,0,0,0.6)">

  <!-- Size / opacity: labelled, value bubble while dragging; system gesture excluded here -->
  <div style="position:absolute;left:24px;top:196px;width:36px;height:196px;border-radius:18px;background:rgba(27,27,29,0.96);box-shadow:0 8px 24px rgba(0,0,0,0.45);display:flex;flex-direction:column;align-items:center;padding:10px 0;box-sizing:border-box;gap:6px">
    <span style="width:8px;height:8px;border-radius:4px;background:#F2F2F0" aria-hidden="true"></span>
    <div style="position:relative;width:5px;flex:1;border-radius:3px;background:#2F2F33">
      <div style="position:absolute;bottom:0;left:0;right:0;height:38%;border-radius:3px;background:#F2F2F0"></div>
      <div style="position:absolute;left:-9px;bottom:calc(38% - 11px);width:22px;height:22px;border-radius:11px;background:#F2F2F0;box-shadow:0 2px 6px rgba(0,0,0,0.5)"></div>
    </div>
    <div style="width:18px;height:1px;background:#2F2F33;margin:2px 0"></div>
    <div style="position:relative;width:5px;flex:1;border-radius:3px;background:#2F2F33">
      <div style="position:absolute;bottom:0;left:0;right:0;height:92%;border-radius:3px;background:#F2F2F0"></div>
      <div style="position:absolute;left:-9px;bottom:calc(92% - 11px);width:22px;height:22px;border-radius:11px;background:#F2F2F0;box-shadow:0 2px 6px rgba(0,0,0,0.5)"></div>
    </div>
    <span style="width:10px;height:10px;border-radius:5px;background:repeating-conic-gradient(#F2F2F0 0 25%,#5E5E64 0 50%) 0 0/5px 5px" aria-hidden="true"></span>
  </div>
  <!-- Bubble shown while the size slider is dragged -->
  <div style="position:absolute;left:50%;margin-left:-62px;top:490px;height:52px;border-radius:14px;background:#252528;box-shadow:0 10px 30px rgba(0,0,0,0.6);display:flex;align-items:center;gap:10px;padding:0 14px 0 10px">
    <span style="width:32px;height:32px;border-radius:8px;background:#ECE6D6;display:flex;align-items:center;justify-content:center"><span style="width:6px;height:6px;border-radius:3px;background:#211C1A"></span></span>
    <span style="display:flex;flex-direction:column"><span style="font-size:11px;color:#A1A1A6">Tamaño</span><span class="tab" style="font-size:15px;font-weight:600">6 px</span></span>
  </div>

  <!-- Tool island: undo/redo within thumb reach, tools, color -->
  <div style="position:absolute;left:10px;right:10px;top:552px;height:60px;border-radius:20px;background:#1B1B1D;box-shadow:0 10px 30px rgba(0,0,0,0.5),inset 0 0 0 1px rgba(255,255,255,0.05);display:flex;align-items:center;padding:0 6px;box-sizing:border-box;gap:1px">
    <button class="ib" aria-label="Deshacer" style="width:40px"><svg viewBox="0 0 24 24"><path d="M9 14L4.5 9.5 9 5"/><path d="M4.5 9.5H15a5 5 0 0 1 0 10h-3"/></svg></button>
    <button class="ib" aria-label="Rehacer (no disponible)" disabled style="width:40px;color:#75757B"><svg viewBox="0 0 24 24" style="stroke-dasharray:0"><path d="M15 14l4.5-4.5L15 5"/><path d="M19.5 9.5H9a5 5 0 0 0 0 10h3"/></svg></button>
    <div style="width:1px;height:28px;background:#2F2F33;margin:0 2px"></div>
    <button class="ib" aria-label="Pincel: Tinta seca. Toca otra vez para ver los pinceles" aria-pressed="true" style="width:44px;height:46px;border-radius:14px;background:#D9F45A;color:#121212;position:relative"><svg viewBox="0 0 24 24"><path d="M4.5 19.5l1.2-4.3 9.6-9.6a2.2 2.2 0 0 1 3.1 3.1l-9.6 9.6z"/><path d="M13.6 7.3l3.1 3.1"/></svg><svg viewBox="0 0 24 24" style="position:absolute;right:3px;top:3px;width:10px;height:10px;stroke-width:3"><path d="M7 14l5-5 5 5"/></svg></button>
    <button class="ib" aria-label="Goma" style="width:44px;height:46px"><svg viewBox="0 0 24 24"><path d="M9 19.5h10"/><path d="M5.6 15.1l8-8a2 2 0 0 1 2.8 0l2.5 2.5a2 2 0 0 1 0 2.8l-7.1 7.1H9.9z"/><path d="M9.6 11.1l4.3 4.3"/></svg></button>
    <button class="ib" aria-label="Relleno" style="width:44px;height:46px"><svg viewBox="0 0 24 24"><path d="M6 10.5l5-5.5 7.5 7.5-5.4 5.4a2 2 0 0 1-2.8 0L6 13.6a2.2 2.2 0 0 1 0-3.1z"/><path d="M6.2 12.4h12"/><path d="M20.5 17c0 1.1-.7 1.9-1.5 1.9s-1.5-.8-1.5-1.9c0-1 1.5-2.6 1.5-2.6s1.5 1.6 1.5 2.6z"/></svg></button>
    <button class="ib" aria-label="Selección" style="width:44px;height:46px"><svg viewBox="0 0 24 24"><path d="M12 4.5c4.3 0 7.7 2 7.7 4.6S16.3 13.7 12 13.7 4.3 11.7 4.3 9.1 7.7 4.5 12 4.5z"/><path d="M8.2 13.1c-1.4.5-2.1 1.6-1.6 2.6.5 1 2 1.2 2.8.3"/><path d="M9.4 16c.1 1.6-.8 3-2.4 3.7"/></svg></button>
    <button class="ib" aria-label="Más herramientas: texto, formas, cuentagotas…" style="width:44px;height:46px"><svg viewBox="0 0 24 24"><circle cx="5.5" cy="12" r="1.5" style="fill:currentColor;stroke:none"/><circle cx="12" cy="12" r="1.5" style="fill:currentColor;stroke:none"/><circle cx="18.5" cy="12" r="1.5" style="fill:currentColor;stroke:none"/></svg></button>
    <button aria-label="Color actual" style="width:44px;height:46px;border:0;background:transparent;display:flex;align-items:center;justify-content:center;padding:0;flex:none">
      <span style="width:30px;height:30px;border-radius:15px;background:#C2523A;box-shadow:0 0 0 2px #1B1B1D,0 0 0 4px #F2F2F0;display:block"></span>
    </button>
  </div>

  <!-- Timeline dock -->
  <div style="position:absolute;left:0;right:0;top:628px;bottom:0;background:#161618;border-radius:24px 24px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,0.45)">
    <div style="width:36px;height:5px;border-radius:3px;background:#3A3A3E;margin:8px auto 0" aria-label="Arrastra hacia arriba para ver las pistas"></div>
    <div style="display:flex;align-items:center;gap:6px;padding:6px 12px 0">
      <button class="ib" aria-label="Reproducir" style="border-radius:22px;background:#F2F2F0;color:#121212"><svg viewBox="0 0 24 24" style="fill:#121212;stroke:none"><path d="M8.5 5.8v12.4a.8.8 0 0 0 1.2.7l10-6.2a.8.8 0 0 0 0-1.4l-10-6.2a.8.8 0 0 0-1.2.7z"/></svg></button>
      <div style="display:flex;align-items:baseline;gap:4px;padding:0 4px">
        <span class="mono" style="font-size:20px;font-weight:600">08</span>
        <span class="tab" style="font-size:13px;color:#A1A1A6">/ 24</span>
      </div>
      <div style="flex:1"></div>
      <button aria-label="Capas. Capa actual: Tinta" style="height:44px;border:0;border-radius:12px;background:#252528;color:#F2F2F0;display:flex;align-items:center;gap:7px;padding:0 12px 0 10px;font-size:14px;font-weight:600">
        <svg viewBox="0 0 24 24" style="width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round"><path d="M12 3.8l8.5 4.6-8.5 4.6-8.5-4.6z"/><path d="M3.5 12.6l8.5 4.6 8.5-4.6"/><path d="M3.5 16.6l8.5 4.6 8.5-4.6"/></svg>Tinta
      </button>
      <button aria-label="Papel cebolla: activado" aria-pressed="true" style="height:44px;border:0;border-radius:12px;background:#252528;color:#F2F2F0;display:flex;align-items:center;gap:6px;padding:0 12px 0 10px;font-size:14px;font-weight:600"><svg viewBox="0 0 24 24" style="width:20px;height:20px;fill:none;stroke:#D9F45A;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round"><circle cx="9.5" cy="12" r="5.5"/><circle cx="14.5" cy="12" r="5.5" stroke-dasharray="2.2 2.2"/></svg>Cebolla<span style="width:6px;height:6px;border-radius:3px;background:#D9F45A"></span></button>
    </div>

    <!-- Strip: current drawing + always-visible new drawing -->
    <div style="position:relative;margin-top:10px;height:104px">
      <div style="position:absolute;left:0;right:64px;top:0;bottom:0;overflow:hidden">
        <div style="position:absolute;left:-18px;top:4px;display:flex;gap:6px">
          <div style="display:flex;flex-direction:column;align-items:center;gap:5px"><img src="/_blob/7b740c5a8f2ef8f71a4c1a1696a7ae37" alt="" style="width:52px;height:65px;border-radius:8px"><span class="tab" style="font-size:11px;color:#A1A1A6">6</span></div>
          <div style="display:flex;flex-direction:column;align-items:center;gap:5px"><img src="/_blob/a1ec0b958ac5bec245de8a034cbbe758" alt="" style="width:52px;height:65px;border-radius:8px"><span class="tab" style="font-size:11px;color:#A1A1A6">7</span></div>
          <div style="display:flex;flex-direction:column;align-items:center;gap:5px"><img src="/_blob/10f76d377b57444960ee88e487676c0a" alt="Dibujo 8, actual" style="width:52px;height:65px;border-radius:8px;box-shadow:0 0 0 2px #161618,0 0 0 4px #D9F45A"><span class="tab" style="font-size:11px;color:#D9F45A;font-weight:700">8</span></div>
          <div style="display:flex;flex-direction:column;align-items:center;gap:5px">
            <div style="position:relative;width:110px;height:65px;border-radius:8px;overflow:hidden;background:#2A2A2E">
              <img src="/_blob/fe4c4c4cbae132edfb8a8a7bdeabfb70" alt="" style="width:52px;height:65px;display:block">
              <div style="position:absolute;left:52px;top:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;background:repeating-linear-gradient(90deg,#2A2A2E 0 6px,#323236 6px 12px)"><span style="font-size:12px;font-weight:600;color:#E2E2DF;background:#161618;border-radius:6px;padding:2px 6px">Dura 2</span></div>
            </div>
            <span class="tab" style="font-size:11px;color:#A1A1A6">9</span>
          </div>
          <div style="display:flex;flex-direction:column;align-items:center;gap:5px"><img src="/_blob/7b740c5a8f2ef8f71a4c1a1696a7ae37" alt="" style="width:52px;height:65px;border-radius:8px"><span class="tab" style="font-size:11px;color:#A1A1A6">11</span></div>
        </div>
        <div style="position:absolute;right:0;top:0;bottom:0;width:24px;background:linear-gradient(270deg,#161618,rgba(22,22,24,0))"></div>
      </div>
      <button aria-label="Nuevo dibujo después del 8" style="position:absolute;right:12px;top:4px;width:52px;height:65px;border:1.5px dashed #75757B;box-sizing:border-box;border-radius:10px;background:#252528;color:#F2F2F0;display:flex;align-items:center;justify-content:center"><svg viewBox="0 0 24 24" style="width:24px;height:24px;fill:none;stroke:#F2F2F0;stroke-width:2.2;stroke-linecap:round"><path d="M12 5v14M5 12h14"/></svg></button>
      <span style="position:absolute;right:12px;top:74px;width:52px;text-align:center;font-size:11px;font-weight:600;color:#D6D6D3">Nuevo</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
